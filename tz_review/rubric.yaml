# Рубрика ревью ТЗ на потоки/витрины данных.
# Источники: INCOSE GtWR / requirements smells (языковой слой),
# data contracts + DWH-testing чеклисты (доменный слой). См. RESEARCH.md.

min_section_chars: 40

required_sections:
  - name: "Источник данных"
    aliases: ["источник", "источники", "описание источника", "системы-источники"]
  - name: "Структура целевых таблиц"
    aliases: ["маппинг", "целевые таблицы", "структура витрины", "структура таблиц", "атрибутный состав", "структура данных"]
  - name: "Правила трансформации"
    aliases: ["трансформац", "расчет показателей", "расчёт показателей", "алгоритм"]
  - name: "Регламент загрузки"
    aliases: ["регламент", "расписание", "периодичность", "способ загрузки", "требования к агрегату"]
  - name: "Контроль качества"
    aliases: ["контроль качества", "проверки", "мониторинг", "качество данных"]

# Полный официальный шаблон МТС (casedata/template_official.md): отсутствие раздела —
# отдельная категория template:official_missing (medium). Пустой раздел допустим
# только с явным «не применимо» (официальное правило, «Основные моменты» п.5).
official_sections:
  - "Общие сведения"
  - "Решаемая проблема"
  - "Продуктовые метрики"
  - "Заказчики"
  - "Нефункциональные требования"
  - "Системы-источники"
  - "Data Catalog"
  - "Исходники проекта"
  - "Команда"
  - "JIRA"
  - "Источники данных"
  - "Приёмники данных"
  - "Схема потоков данных"
  - "Алгоритм обработки"
  - "Структура данных"
  - "Пример данных"
  - "DDL"
  - "FAQ"
  - "История изменений"

# Доменный чеклист полноты: каждый пункт — бинарный вопрос-«слот».
# status OK требует цитаты-доказательства; MISSING = слот не закрыт.
checklist:
  - id: SRC-01
    aspect: "Источник"
    severity: high
    question: "Указан ли способ получения данных из источника: интерфейс/протокол, формат данных (файлы/API/БД) и способ доступа?"
  - id: SRC-02
    aspect: "Источник"
    severity: medium
    question: "Описан ли состав данных источника (перечень полей/счётчиков или ссылка на их спецификацию) без открытых списков вида «и т.д.»?"
  - id: LOC-01
    aspect: "Источник"
    severity: high
    question: "Для каждого источника и приёмника указано расположение: кластер/схема, Kafka-топики или пути к файлам (заглушки обезличивания считаются указанными)?"
  - id: FIL-01
    aspect: "Фильтрация"
    severity: high
    question: "Заданы ли правила фильтрации входных данных И судьба отфильтрованных записей: отбрасываются, логируются или попадают в карантин/таблицу ошибок?"
  - id: MAP-01
    aspect: "Маппинг"
    severity: critical
    question: "Для каждого поля целевой таблицы указан источник: конкретное поле источника или формула расчёта?"
  - id: MAP-02
    aspect: "Маппинг"
    severity: high
    question: "Указаны ли типы данных (и точность/длина, где применимо) для полей целевых таблиц?"
  - id: INC-01
    aspect: "Инкрементальность"
    severity: critical
    question: "Определено ли, как вычисляется инкремент загрузки: по какому полю/курсору отбираются новые данные?"
  - id: INC-02
    aspect: "Инкрементальность"
    severity: high
    question: "Описана ли обработка данных, пришедших с опозданием (late-arriving): окно повторной обработки/перезагрузки?"
  - id: INC-03
    aspect: "Инкрементальность"
    severity: high
    question: "Указано ли, что происходит с записями, удалёнными или изменёнными в источнике задним числом?"
  - id: NUL-01
    aspect: "Обработка значений"
    severity: high
    question: "Заданы ли правила обработки отсутствующих значений (NULL vs 0 vs default) для полей, участвующих в расчётах?"
  - id: NUL-02
    aspect: "Обработка значений"
    severity: high
    question: "Определено ли поведение расчётных формул в краевых случаях (деление на ноль, пустой знаменатель, отсутствие счётчика за период)?"
  - id: DED-01
    aspect: "Дедупликация"
    severity: high
    question: "Указан ли ключ дедупликации и правило выбора выжившей записи при повторной выгрузке/дублях?"
  - id: KEY-01
    aspect: "Ключи"
    severity: high
    question: "Определены ли ключи целевых таблиц (первичный/бизнес-ключ) и гранулярность витрины?"
  - id: SLA-01
    aspect: "Регламент"
    severity: high
    question: "Задано ли расписание загрузки: периодичность и конкретное время запуска?"
  - id: SLA-02
    aspect: "Регламент"
    severity: medium
    question: "Указан ли срок готовности данных (SLA/freshness): к какому времени данные за период должны быть доступны потребителям?"
  - id: ERR-01
    aspect: "Ошибки"
    severity: medium
    question: "Описано ли поведение при сбое: недоступность источника, ретраи, частичная загрузка?"
  - id: ERR-02
    aspect: "Ошибки"
    severity: medium
    question: "Предусмотрен ли контроль полноты загрузки (сверка количества записей/контрольные суммы/реконсиляция)?"
  - id: VOL-01
    aspect: "Объёмы"
    severity: medium
    question: "Указаны ли ожидаемые объёмы данных и срок хранения (retention)?"
  - id: OWN-01
    aspect: "Владение"
    severity: advisory
    question: "Названы ли владелец потока/витрины и потребители данных?"
  # --- Официальные требования МТС (casedata/keypoints_official.md) ---
  - id: SER-01
    aspect: "Сериализация"
    severity: high
    question: "Указана ли модель входного И выходного потока данных: формат, схема, тип сериализации/десериализации?"
  - id: CAT-01
    aspect: "Дата-каталог"
    severity: medium
    question: "Есть ли прямая ссылка на Дата-каталог (Data Catalog) для источников и приёмников (заглушка LINK_* считается ссылкой)?"
  - id: NUL-03
    aspect: "Обязательность полей"
    severity: high
    question: "Для каждого поля витрины явно указан признак обязательности NOT NULL / NULLABLE?"
  - id: FIL-02
    aspect: "Фильтрация"
    severity: medium
    question: "Зафиксированы ли типовые (стандартные) условия фильтрации, применяемые при построении витрины и выгрузке?"
  - id: LOC-02
    aspect: "Инфраструктура"
    severity: high
    question: "Для потоковых источников/приёмников указан кластер Kafka?"
  - id: LOC-03
    aspect: "Инфраструктура"
    severity: high
    question: "Для файловых хранилищ указан полный путь в HDFS с указанием формата?"
  - id: REF-01
    aspect: "Справочники"
    severity: medium
    question: "Приведён ли перечень справочников (НСИ), используемых витриной?"
  - id: KEY-02
    aspect: "Ключи"
    severity: medium
    question: "Описано ли формирование ключа (для Kafka) или партиции (для HDFS) при записи?"

# Языковой слой: детерминированные паттерны (regex, регистронезависимо).
language_patterns:
  incomplete:
    severity: high
    label: "Незавершённость"
    why: "Маркер незаполненного места: документ передаётся в разработку с дырой."
    patterns:
      - "\\bTBD\\b"
      - "\\bTODO\\b"
      - "\\?\\?\\?"
      - "будет\\s+определено"
      - "будет\\s+уточнено"
      - "уточняется"
      - "под\\s+вопросом"
  open_ended:
    severity: medium
    label: "Открытый список"
    why: "Открытый список: разработчик не знает полного состава и додумает сам."
    patterns:
      - "и\\s+т\\.\\s*д\\."
      - "и\\s+т\\.\\s*п\\."
      - "и\\s+про[чи]\\w+"
      - "и\\s+друг\\w+"
      - "включая,?\\s+но\\s+не\\s+ограничиваясь"
  escape:
    severity: medium
    label: "Лазейка"
    why: "Условие-лазейка без критерия: неясно, кто и когда решает, что «необходимо/возможно»."
    patterns:
      - "по\\s+возможности"
      - "при\\s+необходимости"
      - "по\\s+необходимости"
      - "если\\s+(это\\s+)?возможно"
      - "по\\s+согласованию"
      - "желательно"
  vague:
    severity: advisory
    label: "Расплывчатость"
    why: "Неизмеримая формулировка: у исполнителя и автора могут быть разные представления."
    patterns:
      - "\\bоперативн\\w+"
      - "\\bсвоевременн\\w+"
      - "\\bкачественн\\w+\\s+данн\\w+"
      - "\\bактуальн\\w+\\s+данн\\w+"
      - "\\bоптимальн\\w+"
      - "\\bнекотор\\w+"
      - "\\bбольш\\w+\\s+объ[её]м\\w*"
      - "\\bминимальн\\w+\\s+задержк\\w+"
