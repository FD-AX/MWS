# Дополнительные общие слоты чеклиста (EXP-19): «выводные» дефекты, которые gpt-oss-120b не берёт
# без прямого вопроса, а GPT-5.5 берёт зондами (EXP-15: G3-4/6/7/8 — B9/A3/A7/D3).
# Все четыре — стандартные пункты DWH-ревью (поле упорядочивания, lookup-miss, бэкфилл, часовой пояс),
# но калиброваны на промахах doc3 → для них doc3 «обучающий»; честная проверка — synth и doc1/doc2.
# Подключение: load_rubric(extra=True) или TZR_RUBRIC_EXTRA=1. Применимость — регуляркой до вызова модели.
checklist:
  - id: ORD-01
    aspect: Выбор записи
    severity: medium
    question: "Если алгоритм выбирает «последнюю/первую/актуальную» запись (последний IMEI за период, актуальный тариф), указано ли, по какому полю времени или версии она определяется, из какой таблицы это поле берётся, и правило при равенстве значений?"
    applies_if: 'последн|перв[ау]|актуальн|latest|last|max\(|min\('
  - id: REF-02
    aspect: Справочники
    severity: medium
    question: "Задано ли поведение при отсутствии соответствия в справочнике при соединении (ключ не найден — TAC, код региона, тариф): NULL, значение «Unknown», отбрасывание строки или ошибка загрузки?"
    applies_if: 'справочник|нси|join|соедин|_ref|dim_|lookup'
  - id: HIS-01
    aspect: Историческая загрузка
    severity: medium
    question: "Если требуется загрузка исторических данных (бэкфилл, «загрузить историю»), описан ли процесс: глубина истории, откуда берутся исторические данные, порядок и контроль выполнения?"
    applies_if: 'историч|backfill|бэкфил|за прошл|ретроспектив|глубин|с начала'
  - id: TZ-01
    aspect: Время
    severity: medium
    question: "Если в документе фигурируют часовые пояса (UTC, локальное/региональное время), определено ли, в каком поясе считаются границы периодов агрегации (сутки/месяц) и как приводится время источников из других поясов?"
    applies_if: 'utc|gmt|msk|часов[оы][йх]*\s+пояс|timezone|местн[оы][ем]*\s+врем|региональн[оы][ем]*\s+врем'
