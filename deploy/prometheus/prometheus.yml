global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: docs
    static_configs: [{ targets: ["docs:8081"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  # vLLM отдаёт /metrics сам (профиль gpu); RunPod-под снаружи не скрейпится (прокси)
  - job_name: llm
    static_configs: [{ targets: ["llm:8000"] }]
